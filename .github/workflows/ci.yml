# 这是什么：GitHub Actions 的自动化测试配置。
# 作用：每次你 git push 之后，GitHub 会免费开一台机器，自动跑一遍 pytest。
#      测试通过 → 仓库页面出现绿色对勾（CI 徽章变绿）
#      测试失败 → 会给你发邮件，告诉你哪一步挂了
#
# 为什么简历上写这个很值钱：
#   它证明你懂"持续集成（CI）"—— 代码提交后自动验证，而不是靠人工手动测。

name: 自动化测试

# 什么时候触发：push 到 main 分支时，或者有人给你的仓库提 PR 时
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 用 GitHub 免费提供的 Linux 机器来跑
    runs-on: ubuntu-latest

    steps:
      - name: 把代码取到测试机器上
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（照着 requirements.txt 装）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        run: pytest -v